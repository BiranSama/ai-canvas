appId: local.aicanvas.desktop
productName: AI Canvas
copyright: Copyright © 2026
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
directories:
  output: release
files:
  - out/**
  - package.json
  # Only the Windows x64 build of ONNX Runtime ships; the other platforms' libraries are hundreds of MB.
  - '!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
extraResources:
  - from: resources/models
    to: models
    filter:
      - '*.tflite'
win:
  executableName: AI Canvas
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: AI-Canvas-${version}-${arch}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Canvas
portable:
  artifactName: AI-Canvas-${version}-${arch}-Portable.${ext}
# The installed build updates itself from this repository's GitHub Releases (see .github/workflows/release.yml).
publish:
  provider: github
  owner: BiranSama
  repo: ai-canvas
  releaseType: release
releaseInfo:
  releaseNotes: |
    - AI-Canvas-…-Setup.exe 是安装版，装好后会自己检查并下载新版本。
    - AI-Canvas-…-Portable.exe 是免安装版，不会自动更新，新版本请回到这里下载。
    - 安装包还没有代码签名。第一次运行时 Windows 可能提示「Windows 已保护你的电脑」，点「更多信息」，再点「仍要运行」。
