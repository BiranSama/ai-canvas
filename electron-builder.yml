appId: local.aicanvas.desktop
productName: AI Canvas
copyright: Copyright © 2026
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
directories:
  output: release
files:
  - out/**
  - package.json
  # Only the Windows x64 build of ONNX Runtime ships; the other platforms' libraries are hundreds of MB.
  - '!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
extraResources:
  - from: resources/models
    to: models
    filter:
      - '*.tflite'
win:
  executableName: AI Canvas
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: AI-Canvas-${version}-${arch}-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Canvas
portable:
  artifactName: AI-Canvas-${version}-${arch}-Portable.${ext}
publish: null
