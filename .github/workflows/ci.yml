name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Keep LF endings on the runner so lint and fixture comparisons see the
      # same bytes as the repository.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # Reads the pnpm version from package.json#packageManager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm test:integration
