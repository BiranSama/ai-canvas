<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-label="AI Canvas revision-aware commit path">
<title>AI Canvas revision-aware commit path</title><defs><linearGradient id="trace"><stop stop-color="#376BFF"/><stop offset=".58" stop-color="#9276FF"/><stop offset="1" stop-color="#EAD9B8"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D5DEEA" stroke-width=".6"/></pattern></defs>
<g font-family="Segoe UI, Arial, sans-serif"><rect x="0" y="0" width="1200" height="365" rx="0" fill="#F5F7FA" stroke="#F5F7FA"/><text x="40" y="49" font-size="25" fill="#172033" font-weight="600">A MUTATION IS A CHECKED COMMIT</text><text x="40" y="84" font-size="19" fill="#52627B" >Illustrative revision numbers · Main remains the Scene authority</text><rect x="40" y="125" width="260" height="106" rx="8" fill="white" stroke="#BFCCE0"/><text x="58" y="164" font-size="23" fill="#376BFF" font-weight="600">PROPOSE</text><text x="58" y="201" font-size="16" fill="#172033" >expected revision = 42</text><rect x="337" y="125" width="260" height="106" rx="8" fill="white" stroke="#BFCCE0"/><text x="355" y="164" font-size="23" fill="#376BFF" font-weight="600">PREPARE</text><text x="355" y="201" font-size="16" fill="#172033" >policy + scope + preview</text><rect x="634" y="125" width="260" height="106" rx="8" fill="white" stroke="#BFCCE0"/><text x="652" y="164" font-size="23" fill="#376BFF" font-weight="600">COMMIT</text><text x="652" y="201" font-size="16" fill="#172033" >recheck revision + batch</text><rect x="931" y="125" width="229" height="106" rx="8" fill="white" stroke="#BFCCE0"/><text x="949" y="164" font-size="23" fill="#376BFF" font-weight="600">PERSIST</text><text x="949" y="201" font-size="16" fill="#172033" >revision 43 + undo</text><path d="M300 178 L337 178" fill="none" stroke="#376BFF" stroke-width="3"/><path d="M597 178 L634 178" fill="none" stroke="#9276FF" stroke-width="3"/><path d="M894 178 L931 178" fill="none" stroke="#9276FF" stroke-width="3"/><path d="M764 231V270H40" fill="none" stroke="#9276FF" stroke-width="2"/><text x="40" y="311" font-size="23" fill="#172033" >Scene changed in the meantime? → SCENE_REVISION_STALE</text><text x="40" y="344" font-size="19" fill="#52627B" >A stale plan must be reconciled with the current canvas before a new commit.</text></g></svg>