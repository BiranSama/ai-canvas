<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">AI Canvas — The canvas is the context.</title>
  <desc id="desc">An editable creative runtime shared by humans and AI. Intent, composition, generation and refinement stay connected through a structured scene.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f8fa"/><stop offset="1" stop-color="#e7edf4"/></linearGradient>
    <linearGradient id="trace" x2="1" y2="1"><stop stop-color="#376bff"/><stop offset=".65" stop-color="#9276ff"/><stop offset="1" stop-color="#c0ab80"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#172033" opacity=".08"/></pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#243655" flood-opacity=".09"/></filter>
  </defs>
  <rect width="1440" height="520" rx="20" fill="url(#paper)"/>
  <rect x="800" width="640" height="520" fill="url(#grid)"/>
  <path d="M64 66H1376" stroke="#172033" stroke-opacity=".12"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#172033">
    <text x="66" y="44" font-size="13" font-weight="600" letter-spacing="2">A CREATIVE RUNTIME FOR HUMAN × AI</text>
    <text x="1376" y="44" text-anchor="end" font-size="12" letter-spacing="1" fill="#64718a">LOCAL-FIRST / SCENE-NATIVE</text>
    <text x="60" y="206" font-size="113" font-weight="650" letter-spacing="-7">AI CANVAS</text>
    <text x="66" y="268" font-size="37" font-weight="400" letter-spacing="-1">The canvas is the context.</text>
    <text x="68" y="319" font-size="22" font-family="Segoe UI,Microsoft YaHei UI,sans-serif" fill="#53617a">让意图进入画布，让每一次创作都能继续。</text>
    <rect x="66" y="365" width="41" height="3" rx="1.5" fill="url(#trace)"/>
    <text x="66" y="411" font-size="14" fill="#56647b">EDITABLE BY DESIGN. TRACEABLE BY ARCHITECTURE.</text>
    <path d="M66 451H1376" stroke="#172033" stroke-opacity=".12"/>
    <g font-size="13" fill="#64718a"><text x="66" y="484">01 / INTENT</text><text x="360" y="484">02 / COMPOSITION</text><text x="744" y="484">03 / GENERATION</text><text x="1143" y="484">04 / REFINEMENT</text></g>
  </g>
  <g filter="url(#shadow)">
    <rect x="964" y="116" width="286" height="254" rx="13" fill="#e9e8e4" stroke="#fff" transform="rotate(9 1107 243)"/>
    <rect x="942" y="123" width="286" height="254" rx="13" fill="#f4f5f7" stroke="#fff" transform="rotate(-5 1085 250)"/>
    <rect x="950" y="128" width="286" height="254" rx="13" fill="#fff" stroke="#d7e0ee"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="974" y="157" font-size="11" fill="#7a869b" letter-spacing="1.3">SHARED STRUCTURED SCENE</text>
    <rect x="978" y="183" width="172" height="33" rx="3" fill="#edf2fb"/>
    <text x="989" y="205" font-size="17" fill="#233551">Make something yours.</text>
    <rect x="978" y="234" width="94" height="113" rx="3" fill="#d4e0db"/>
    <path d="M978 321L1007 278 1041 315 1072 300V347H978Z" fill="#819f9d"/>
    <circle cx="1050" cy="257" r="11" fill="#dbc998"/>
    <path d="M1090 244H1204M1090 257H1187M1090 270H1197" stroke="#dce2ec" stroke-width="4"/>
    <rect x="1086" y="292" width="115" height="47" rx="3" fill="none" stroke="#376bff" stroke-width="1.5"/>
    <circle cx="1086" cy="292" r="4" fill="white" stroke="#376bff"/><circle cx="1201" cy="339" r="4" fill="white" stroke="#376bff"/>
    <text x="1098" y="320" font-size="12" fill="#376bff">YOUR NEXT EDIT</text>
    <rect x="838" y="173" width="89" height="34" rx="17" fill="#172033"/>
    <text x="882" y="195" text-anchor="middle" font-size="12" fill="#fff">HUMAN</text>
    <rect x="1255" y="287" width="98" height="34" rx="17" fill="#172033"/>
    <text x="1304" y="309" text-anchor="middle" font-size="12" fill="#fff">AI AGENT</text>
  </g>
  <path d="M927 190H961M1255 304C1228 304 1223 317 1204 317" fill="none" stroke="url(#trace)" stroke-width="2"/>
</svg>
